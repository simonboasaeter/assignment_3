<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Playlist App</title>
    <script defer src="./data/songs.js"></script>
    <script defer src="./js/app.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="music-player">
      <aside class="music-player__playlist">
        <h2>Min spilleliste</h2>
        <div class="music-player__playlist-list"></div>
        <p class="music-player__playlist-total"></p>
      </aside>

      <div class="music-player__container">
        <div class="music-player__header">
          <div class="music-player__select-wrapper">
            <label for="song-sort">Sorter etter</label>
            <select id="song-sort">
              <option value="title">Tittel</option>
              <option value="artist">Artist</option>
              <option value="duration">Varighet</option>
            </select>
          </div>

          <div class="music-player__select-wrapper">
            <label for="genre-filter">Sjanger</label>
            <select id="genre-filter">
              <option value="">Alle sjangre</option>
            </select>
          </div>

          <div class="music-player__select-wrapper">
            <label for="song-search">Søk</label>
            <input
              id="song-search"
              type="text"
              class="music-player__search"
              oninput="
                songFilter = this.value;
                initializePlayer(songs);
              "
            />
          </div>
        </div>

        <div class="music-player__songs">
          <div class="music-player__songs-header">
            <span class="music-player__header-title">Title</span>
            <span class="music-player__header-artist">Artist</span>
            <span class="music-player__header-genre">Genre</span>
            <span class="music-player__header-duration">Duration</span>
            <span class="music-player__song-add"></span>
          </div>

          <div class="music-player__songs-list"></div>
        </div>

        <div class="music-player__controls">
          <div class="music-player__play-bar">
            <div class="music-player__navigation">
              <button
                type="button"
                id="previous-song"
                class="music-player__navigation-button"
                title="Forrige sang"
              >
                <span class="music-player__navigation-button-icon">
                  &#9198;
                </span>
              </button>

              <button
                type="button"
                class="music-player__navigation-button music-player__navigation-button--play"
                title="Spill av"
              >
                ▶
              </button>

              <button
                type="button"
                id="next-song"
                class="music-player__navigation-button"
                title="Neste sang"
              >
                <span class="music-player__navigation-button-icon">
                  &#9197;
                </span>
              </button>
            </div>
          </div>
        </div>

        <template id="current-song-template">
          <div class="music-player__play-bar__current-song">
            <p class="music-player__play-bar__current-song-title"></p>
            <p class="music-player__play-bar__current-song-artist"></p>
          </div>
        </template>

        <template id="song-template">
          <div class="music-player__card">
            <p class="music-player__song-title"></p>
            <p class="music-player__song-artist"></p>
            <p class="music-player__song-genre"></p>
            <p class="music-player__song-duration"></p>
            <button type="button" class="music-player__song-add">+</button>
          </div>
        </template>
      </div>
    </main>
    <footer>
      This is a student project created for educational purposes and is not an
      official or affiliated website.
    </footer>
  </body>
</html>
