<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Playlist App</title>
    <script defer src="./data/songs.js"></script>
    <script defer src="./js/app.js"></script>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="music-player">
      <div class="music-player__container">
        <div class="music-player__header">
          <input
            type="text"
            placeholder="Search songs..."
            class="music-player__search"
            oninput="
              songFilter = this.value;
              initializePlayer(songs);
            "
          />
        </div>

        <div class="music-player__songs">
          <div class="music-player__songs-header">
            <span class="music-player__header-title">Title</span>
            <span class="music-player__header-artist">Artist</span>
            <span class="music-player__header-genre">Genre</span>
            <span class="music-player__header-duration">Duration</span>
          </div>

          <div class="music-player__songs-list"></div>
        </div>

        <div class="music-player__controls">
          <div class="music-player__play-bar">
            <div class="music-player__navigation">
              <div
                class="music-player__navigation-button"
                onclick="playPreviousSong(songs)"
              >
                <p class="music-player__navigation-button-icon">&#9198;</p>
              </div>
              <div
                class="music-player__navigation-button music-player__navigation-button--play"
                onclick="togglePlayPause()"
              >
                Play
              </div>
              <div
                class="music-player__navigation-button"
                onclick="playNextSong(songs)"
              >
                <p class="music-player__navigation-button-icon">&#9197;</p>
              </div>
            </div>
          </div>
        </div>

        <template id="current-song-template">
          <div class="music-player__play-bar__current-song">
            <p class="music-player__play-bar__current-song-title"></p>
            <p class="music-player__play-bar__current-song-artist"></p>
          </div>
        </template>

        <template id="song-template">
          <div class="music-player__card">
            <p class="music-player__song-title"></p>
            <p class="music-player__song-artist"></p>
            <p class="music-player__song-genre"></p>
            <p class="music-player__song-duration"></p>
          </div>
        </template>
      </div>
    </main>
    <footer>Education purpose warning</footer>
  </body>
</html>
